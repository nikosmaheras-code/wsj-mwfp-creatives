<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- GAM HTML5 ad declaration — update width to match placement (300|728|970) -->
  <meta name="ad.size" content="width=728,height=21" />
  <title>Polymarket Ticker</title>
  <!-- GAM Enabler — required for click tracking in Studio/GAM HTML5 -->
  <script src="https://s0.2mdn.net/ads/studio/Enabler.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      /* Anchor rem to our design scale — immune to browser default & WSJ's root font.
         Change this one value to scale all text up/down uniformly. */
      font-size: 9px;
    }

    html, body {
      background: #000;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    /* ── Outer wrapper ─────────────────────────────────────── */
    .ticker-root {
      display: flex;
      flex-direction: row;
      align-items: center;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    /* Polymarket logo pill ─────────────────────────────────── */
    .ticker-logo {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2px 4px;
      height: 100%;
      background: #2E5CFF;
      flex-shrink: 0;
      z-index: 3;
    }

    .ticker-logo svg {
      display: block;
    }

    /* Right-edge fade on logo */
    .ticker-logo-fade {
      width: 22px;
      height: 100%;
      background: linear-gradient(90deg, #000 0%, rgba(0,0,0,0) 100%);
      transform: scaleX(-1);
      flex-shrink: 0;
      z-index: 2;
      margin-left: -22px;
      position: relative;
    }

    /* Scrolling area — flex row so the two sibling lists sit side by side */
    .ticker-scroll-area {
      flex: 1;
      height: 100%;
      overflow: hidden;
      display: flex;
      position: relative;
    }

    /* Left gradient — fades content as it slides under the logo pill */
    .ticker-scroll-area::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 32px; height: 100%;
      background: linear-gradient(90deg, #000 0%, rgba(0,0,0,0) 100%);
      z-index: 3;
      pointer-events: none;
    }

    /* Right gradient — fades content at the far right edge */
    .ticker-scroll-area::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 40px; height: 100%;
      background: linear-gradient(270deg, #000 0%, rgba(0,0,0,0) 100%);
      z-index: 3;
      pointer-events: none;
    }

    /* Each list is flex:none so it never stretches.
       padding-right creates the gap between end of this list and
       start of the next. Both lists share the same animation so they
       stay perfectly in sync — no gap, no jump. */
    .ticker-track {
      display: flex;
      flex-direction: row;
      align-items: center;
      flex: none;
      height: 100%;
      padding-right: 60px;
      will-change: transform;
      animation: ticker-scroll var(--ticker-duration, 20s) linear infinite;
      animation-play-state: paused;
    }

    @keyframes ticker-scroll {
      to { transform: translateX(-100%); }
    }

    /* ── Individual items ─────────────────────────────────────── */
    .ticker-item {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 7px;
      height: 100%;
      flex-shrink: 0;
      text-decoration: none;
      cursor: pointer;
    }

    .ticker-question {
      font-family: 'Geist Mono', 'Courier New', monospace;
      font-weight: 500;
      font-size: 1rem;
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #fff;
      white-space: nowrap;
    }

    .ticker-odds {
      font-family: 'Geist Mono', 'Courier New', monospace;
      font-weight: 500;
      font-size: 1rem;
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .ticker-odds.yes { color: #65D26E; }
    .ticker-odds.no  { color: #FF6C6C; }

    /* Vertical divider between items */
    .ticker-divider {
      display: inline-block;
      width: 1px;
      height: 100%;
      background: rgba(255,255,255,0.5);
      flex-shrink: 0;
      margin: 0 10px;
    }
  </style>
</head>
<body>

<div class="ticker-root">
  <!-- Polymarket CANDY logo pill -->

.24533 56.272 8.03852C56.0523 7.83171 55.9427 7.50167 55.9427 7.04837V4.44762H55.1797V3.66571H55.9427V2.54384H57.0221V3.66571H57.8456V4.44762H57.0221V6.97612C57.0221 7.16877 57.0623 7.29981 57.1435 7.36923C57.2244 7.43864 57.3458 7.47333 57.5075 7.47333C57.623 7.47333 57.746 7.45916 57.8759 7.43082V8.24676Z" fill="white"/>

  </div>

  <!-- Scrolling ticker -->
  <div class="ticker-scroll-area">
    <div class="ticker-track" id="tickerTrack">
      <!-- populated by JS -->
    </div>
  </div>
</div>

<script>
  // ── Config ──────────────────────────────────────────────────────
  const SCROLL_PX_PER_SEC = 45;
  const REFRESH_MS        = 60 * 60 * 1000; // 1 hour
  const MARKET_COUNT      = 10;

  // Full URL required — relative paths don't work when GAM hosts the zip.
  // Update this to your deployed Vercel URL before uploading to GAM.
  const API_URL = 'https://polymarket-ticker.vercel.app/api/markets';

  // GAM click tag — GAM injects the destination URL at serve time.
  // Falls back to polymarket.com/finance/privates if not in GAM context.
  var clickTag = typeof clickTag !== 'undefined' && clickTag
    ? clickTag
    : 'https://polymarket.com/finance/privates';

  // ── API helpers ─────────────────────────────────────────────────
  async function fetchPrivatesMarkets() {
    try {
      const res = await fetch(API_URL);
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) return data;
      }
    } catch (e) {
      console.warn('[ticker] proxy fetch failed', e);
    }
    return null;
  }

  // ── Data shaping ─────────────────────────────────────────────────
  // The proxy already returns shaped {question, yesPct, slug} objects.
  function parseItem(market) {
    const question = (market.question || '').trim();
    const yesPct   = market.yesPct ?? 50;
    const isYes    = yesPct >= 50;
    return {
      question,
      label:      isYes ? 'YES' : 'NO',
      pct:        yesPct,
      colorClass: isYes ? 'yes' : 'no',
      slug:       market.slug || '',
    };
  }

  // ── DOM helpers ──────────────────────────────────────────────────
  function esc(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderItems(items) {
    return items.map((item, i) => {
      const divider = i > 0 ? '<span class="ticker-divider"></span>' : '';
      // Use GAM Enabler exit if available, otherwise direct link
      const marketUrl = item.slug
        ? `https://polymarket.com/event/${esc(item.slug)}`
        : 'https://polymarket.com/finance/privates';
      const onclick = `(typeof Enabler!=='undefined'&&Enabler.isInitialized())?Enabler.exit('clickTag','${marketUrl}'):window.open('${marketUrl}','_blank');return false;`;
      return `${divider}<a class="ticker-item" href="${marketUrl}" onclick="${onclick}" target="_blank" rel="noopener">
        <span class="ticker-question">${esc(item.question)}</span>
        <span class="ticker-odds ${item.colorClass}">${item.label} ${item.pct}%</span>
      </a>`;
    }).join('');
  }

  // ── Animation ────────────────────────────────────────────────────
  let resizeTimer = null;

  function startMarquee() {
    const area  = document.querySelector('.ticker-scroll-area');
    const track = document.getElementById('tickerTrack');

    // Remove previous clone
    const old = area.querySelector('.ticker-clone');
    if (old) old.remove();

    // Measure one set of items
    track.innerHTML = cachedItemsHTML;
    void track.offsetWidth;
    const singleWidth = track.offsetWidth;

    // Repeat items until the list is wider than the scroll area —
    // guarantees no black gap is ever visible on any viewport width.
    const needed = Math.max(2, Math.ceil((area.offsetWidth + singleWidth) / singleWidth));
    let html = cachedItemsHTML;
    for (let i = 1; i < needed; i++) {
      html += '<span class="ticker-divider"></span>' + cachedItemsHTML;
    }
    track.innerHTML = html;
    void track.offsetWidth;

    const duration = track.offsetWidth / SCROLL_PX_PER_SEC;
    track.style.setProperty('--ticker-duration', `${duration}s`);
    track.style.animationPlayState = 'paused';

    // Clone the filled list — both animate translateX(-100%) in sync,
    // always perfectly adjacent, zero gap possible.
    const clone = track.cloneNode(true);
    clone.id = '';
    clone.classList.add('ticker-clone');
    area.appendChild(clone);

    track.style.animationPlayState = 'running';
    clone.style.animationPlayState = 'running';
  }

  // ── Main update ──────────────────────────────────────────────────
  let cachedItemsHTML = '';

  async function updateTicker() {
    const markets = await fetchPrivatesMarkets();

    let items;
    if (markets && markets.length > 0) {
      items = markets.map(parseItem).filter(i => i.question);
    } else {
      items = [
        { question: 'OpenAI $750B valuation by Dec 31?',     label: 'YES', pct: 61, colorClass: 'yes', slug: '' },
        { question: 'SpaceX $1.75T valuation by Dec 31?',    label: 'NO',  pct: 34, colorClass: 'no',  slug: '' },
        { question: 'Anthropic $500B valuation by Dec 31?',  label: 'YES', pct: 67, colorClass: 'yes', slug: '' },
        { question: 'Databricks $150B valuation by Dec 31?', label: 'YES', pct: 47, colorClass: 'yes', slug: '' },
      ];
    }

    cachedItemsHTML = renderItems(items);
    requestAnimationFrame(startMarquee);
  }

  // Recalculate duration on resize (content width doesn't change, only
  // needed if font scaling changes — debounced to avoid re-entrant calls)
  const resizeObserver = new ResizeObserver(() => {
    if (!cachedItemsHTML) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(startMarquee, 50);
  });
  resizeObserver.observe(document.querySelector('.ticker-scroll-area'));

  // Boot
  updateTicker();
  setInterval(updateTicker, REFRESH_MS);
</script>
</body>
</html>
