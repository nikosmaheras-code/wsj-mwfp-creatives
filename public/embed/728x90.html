<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<title>Polymarket 728x90</title>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 728px;
      height: 90px;
      overflow: hidden;
      background: #fff;
    }

    .pmt-root {
      position: relative;
      width: 728px;
      height: 90px;
      overflow: hidden;
      cursor: pointer;
      background: #fff;
    }

    /* Grid background */
    .pmt-grid {
      position: absolute;
      inset: 0 0 21px 0;
      background-image: url('../assets/grid-728.png');
      background-position: center;
      background-size: cover;
      opacity: 0.4;
      pointer-events: none;
    }

    /* Upper section: top 69px */
    .pmt-upper {
      position: absolute;
      top: 0;
      left: 0;
      width: 728px;
      height: 69px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
    }

    .pmt-upper .logo-left {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .pmt-upper .logo-left img {
      height: 28px;
      width: 78px;
      object-fit: contain;
    }

    .pmt-upper .headline {
      flex: 1;
      text-align: center;
      line-height: 1.2;
    }

    .pmt-upper .headline .line1 {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 24px;
      letter-spacing: -0.96px;
      color: rgba(0,0,0,0.75);
      display: block;
      white-space: nowrap;
    }

    .pmt-upper .headline .line2 {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 24px;
      letter-spacing: -0.96px;
      display: block;
      white-space: nowrap;
    }

    .pmt-upper .headline .line2 .muted {
      color: rgba(0,0,0,0.6);
    }

    .pmt-upper .headline .line2 .blue {
      color: #2e5cff;
    }

    .pmt-upper .logo-right {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .pmt-upper .logo-right img {
      height: 20px;
      width: 111px;
      object-fit: contain;
    }

    /* Lower black ticker strip: bottom 21px */
    .pmt-ticker {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 728px;
      height: 21px;
      background: #000;
      display: flex;
      flex-direction: row;
      align-items: center;
      overflow: hidden;
    }

    /* CANDY logo pill at left */
    .ticker-candy {
      flex-shrink: 0;
      height: 21px;
      z-index: 3;
    }

    .ticker-candy img {
      height: 21px;
      width: 72px;
      display: block;
      object-fit: fill;
    }

    /* Scrolling area */
    .ticker-scroll-area {
      flex: 1;
      height: 100%;
      overflow: hidden;
      display: flex;
      position: relative;
    }

    .ticker-scroll-area::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 22px; height: 100%;
      background: linear-gradient(90deg, #000 0%, rgba(0,0,0,0) 100%);
      z-index: 3;
      pointer-events: none;
    }

    .ticker-scroll-area::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 32px; height: 100%;
      background: linear-gradient(270deg, #000 0%, rgba(0,0,0,0) 100%);
      z-index: 3;
      pointer-events: none;
    }

    .ticker-track {
      display: flex;
      flex-direction: row;
      align-items: center;
      flex: none;
      height: 100%;
      padding-right: 60px;
      will-change: transform;
      animation: ticker-scroll var(--ticker-duration, 20s) linear infinite;
      animation-play-state: paused;
    }

    @keyframes ticker-scroll {
      to { transform: translateX(-100%); }
    }

    .ticker-item {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 5px;
      height: 100%;
      flex-shrink: 0;
      text-decoration: none;
      cursor: pointer;
    }

    .ticker-question {
      font-family: 'Geist Mono', 'Courier New', monospace;
      font-weight: 500;
      font-size: 9px;
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #fff;
      white-space: nowrap;
    }

    .ticker-odds {
      font-family: 'Geist Mono', 'Courier New', monospace;
      font-weight: 500;
      font-size: 9px;
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .ticker-odds.yes { color: #49c175; }
    .ticker-odds.no  { color: #d24444; }

    .ticker-divider {
      display: inline-block;
      width: 1px;
      height: 60%;
      background: rgba(255,255,255,0.4);
      flex-shrink: 0;
      margin: 0 8px;
    }
  </style>
</head>
<body>

<div class="pmt-root" onclick="handleClick(event)">
  <div class="pmt-grid"></div>

  <!-- Upper section -->
  <div class="pmt-upper">
    <div class="logo-left">
      <img src="../assets/nasdaq-pm-728.svg" alt="Nasdaq × Polymarket" />
    </div>
    <div class="headline">
      <span class="line1">Trade private companies,</span>
      <span class="line2">
        <span class="muted">exclusively on </span><span class="blue">Polymarket</span>
      </span>
    </div>
    <div class="logo-right">
      <img src="../assets/pm-lockup-728.svg" alt="Polymarket" />
    </div>
  </div>

  <!-- Lower ticker strip -->
  <div class="pmt-ticker">
    <div class="ticker-candy">
      <img src="../assets/ticker-candy-728.svg" alt="" />
    </div>
    <div class="ticker-scroll-area">
      <div class="ticker-track" id="tickerTrack">
        <!-- populated by JS -->
      </div>
    </div>
  </div>
</div>

<script>
  var clickTag = 'https://polymarket.com/finance/privates';

  function handleClick(e) {
    if (typeof Enabler !== 'undefined' && Enabler.isInitialized && Enabler.isInitialized()) {
      Enabler.exit('clickTag', clickTag);
    } else {
      window.open(clickTag, '_blank');
    }
  }

  // ── Ticker config ──────────────────────────────────────────────
  var SCROLL_PX_PER_SEC = 45;
  var REFRESH_MS = 60 * 60 * 1000;
  var API_URL = 'https://gamma-api.polymarket.com/events?active=true&limit=30&tag_slug=privates&order=volume&ascending=false';
  var cachedItemsHTML = '';
  var resizeTimer = null;

  var VALUATION_RE = /will (.+?)['']s?\s+valuation hit/i;

  function extractDollarAmount(label) {
    if (!label) return 0;
    var m = label.match(/\$([\d.]+)\s*([BT])?/i);
    if (!m) return 0;
    var n = parseFloat(m[1]);
    var unit = (m[2] || '').toUpperCase();
    return unit === 'T' ? n * 1000 : n;
  }

  function parseGammaEvents(events) {
    var byCompany = {};
    for (var i = 0; i < events.length; i++) {
      var evt = events[i];
      var match = VALUATION_RE.exec(evt.title || '');
      if (!match) continue;
      var company = match[1].trim();
      var vol = parseFloat(evt.volume || 0);
      if (!byCompany[company] || vol > parseFloat(byCompany[company].volume || 0)) {
        byCompany[company] = evt;
      }
    }
    var cards = [];
    for (var company in byCompany) {
      var evt = byCompany[company];
      var markets = (evt.markets || []).filter(function(m) {
        var outcomes = [];
        try { outcomes = JSON.parse(m.outcomes || '[]'); } catch(_) {}
        return outcomes.length === 2 && outcomes[0].toLowerCase() === 'yes' && outcomes[1].toLowerCase() === 'no';
      });
      if (!markets.length) continue;
      markets.sort(function(a, b) { return parseFloat(b.volume || 0) - parseFloat(a.volume || 0); });
      var top2 = markets.slice(0, 2);
      top2.sort(function(a, b) { return extractDollarAmount(b.groupItemTitle) - extractDollarAmount(a.groupItemTitle); });
      var outcomes = top2.map(function(m) {
        var yesPct = 50;
        try {
          var prices = JSON.parse(m.outcomePrices || '[]');
          if (prices.length >= 1) yesPct = Math.round(parseFloat(prices[0]) * 100);
        } catch(_) {}
        return { valuation: (m.groupItemTitle || '').trim(), yesPct: yesPct, slug: m.slug || '' };
      });
      cards.push({ company: company, question: evt.title || '', slug: evt.slug || '', volume: parseFloat(evt.volume || 0), outcomes: outcomes });
    }
    cards.sort(function(a, b) { return b.volume - a.volume; });
    return cards.slice(0, 8);
  }

  function esc(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // One ticker item per company card, using the top (highest-volume) outcome's specific valuation.
  function parseItem(card) {
    var top = (card.outcomes || [])[0] || {};
    var yesPct = top.yesPct != null ? top.yesPct : 50;
    var isYes = yesPct >= 50;
    // Build specific question: "ANTHROPIC ↑$1.75T VALUATION BY DEC 31?"
    var company = (card.company || '').toUpperCase();
    var valuation = (top.valuation || '').toUpperCase();
    // Extract deadline from generic question e.g. "by December 31" or "by Jun 30"
    var q = card.question || '';
    var byMatch = q.match(/by\s+(\w+)\s+(\d+)/i);
    var deadline = byMatch ? 'BY ' + byMatch[1].toUpperCase().slice(0, 3) + ' ' + byMatch[2] : 'BY DEC 31';
    var question = company + ' ' + valuation + ' VALUATION ' + deadline + '?';
    return {
      question: question,
      label: isYes ? 'YES' : 'NO',
      pct: yesPct,
      colorClass: isYes ? 'yes' : 'no',
      slug: top.slug || card.slug || ''
    };
  }

  function renderItems(items) {
    return items.map(function(item, i) {
      var divider = i > 0 ? '<span class="ticker-divider"></span>' : '';
      var marketUrl = item.slug
        ? 'https://polymarket.com/event/' + esc(item.slug)
        : 'https://polymarket.com/finance/privates';
      var onclick = "(typeof Enabler!=='undefined'&&Enabler.isInitialized&&Enabler.isInitialized())?Enabler.exit('clickTag','" + marketUrl + "'):window.open('" + marketUrl + "','_blank');return false;";
      return divider + '<a class="ticker-item" href="' + marketUrl + '" onclick="' + onclick + '" target="_blank" rel="noopener">' +
        '<span class="ticker-question">' + esc(item.question) + '</span>' +
        '<span class="ticker-odds ' + item.colorClass + '">' + item.label + ' ' + item.pct + '%</span>' +
        '</a>';
    }).join('');
  }

  function startMarquee() {
    var area = document.querySelector('.ticker-scroll-area');
    var track = document.getElementById('tickerTrack');
    var old = area.querySelector('.ticker-clone');
    if (old) old.remove();

    track.innerHTML = cachedItemsHTML;
    void track.offsetWidth;
    var singleWidth = track.offsetWidth;

    var needed = Math.max(2, Math.ceil((area.offsetWidth + singleWidth) / singleWidth));
    var html = cachedItemsHTML;
    for (var i = 1; i < needed; i++) {
      html += '<span class="ticker-divider"></span>' + cachedItemsHTML;
    }
    track.innerHTML = html;
    void track.offsetWidth;

    var duration = track.offsetWidth / SCROLL_PX_PER_SEC;
    track.style.setProperty('--ticker-duration', duration + 's');
    track.style.animationPlayState = 'paused';

    var clone = track.cloneNode(true);
    clone.id = '';
    clone.classList.add('ticker-clone');
    area.appendChild(clone);

    track.style.animationPlayState = 'running';
    clone.style.animationPlayState = 'running';
  }

  async function fetchPrivatesMarkets() {
    try {
      var res = await fetch(API_URL);
      if (res.ok) {
        var data = await res.json();
        if (Array.isArray(data) && data.length > 0) return parseGammaEvents(data);
      }
    } catch(e) {
      console.warn('[ticker] fetch failed', e);
    }
    return null;
  }

  var FALLBACK_ITEMS = [
    { question: 'ANTHROPIC ↑$1.75T VALUATION BY DEC 31?', label: 'YES', pct: 40, colorClass: 'yes', slug: '' },
    { question: 'OPENAI ↑$3.0T VALUATION BY DEC 31?',     label: 'NO',  pct: 14, colorClass: 'no',  slug: '' },
    { question: 'SPACEX ↑$2.5T VALUATION BY JUN 30?',     label: 'YES', pct: 46, colorClass: 'yes', slug: '' },
    { question: 'STRIPE ↑$190B VALUATION BY JUN 30?',     label: 'NO',  pct: 21, colorClass: 'no',  slug: '' }
  ];

  async function updateTicker() {
    var cards = await fetchPrivatesMarkets();
    var items;
    if (cards && cards.length > 0) {
      items = cards.map(parseItem).filter(function(i) { return i.question; });
    } else {
      items = FALLBACK_ITEMS;
    }
    cachedItemsHTML = renderItems(items);
    requestAnimationFrame(startMarquee);
  }

  var resizeObserver = new ResizeObserver(function() {
    if (!cachedItemsHTML) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(startMarquee, 50);
  });
  resizeObserver.observe(document.querySelector('.ticker-scroll-area'));

  updateTicker();
  setInterval(updateTicker, REFRESH_MS);
</script>
</body>
</html>
