<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<title>Polymarket 300x600</title>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 300px;
      height: 600px;
      overflow: hidden;
      background: #fff;
    }

    .pmt-root {
      position: relative;
      width: 300px;
      height: 600px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    /* Grid background */
    .pmt-grid {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 648px;
      height: 648px;
      background-image: url('../assets/grid-300.png');
      background-position: center;
      background-size: contain;
      opacity: 0.4;
      pointer-events: none;
    }

    /* Top branding: logos + headline */
    .pmt-top {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      padding: 20px 20px 0;
    }

    .logos-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .logos-row img.nasdaq {
      height: 29px;
      width: 72px;
      object-fit: contain;
    }

    .logos-row img.xsep {
      width: 14.8px;
      height: 14.8px;
      object-fit: contain;
    }

    .logos-row img.pm-lockup {
      height: 16.3px;
      width: 90px;
      object-fit: contain;
    }

    .headline {
      margin-bottom: 0;
      text-align: center;
    }

    .headline .line1 {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 21.6px;
      letter-spacing: -0.864px;
      color: rgba(0,0,0,0.75);
      display: block;
      line-height: 1;
      white-space: nowrap;
    }

    .headline .line2 {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 21.6px;
      letter-spacing: -0.864px;
      display: block;
      line-height: 1;
      white-space: nowrap;
    }

    .headline .muted { color: rgba(0,0,0,0.6); }
    .headline .blue  { color: #2e5cff; }

    /* Cards section: takes remaining space, overflow hidden by pmt-root */
    .pmt-cards-section {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 24px 20px 0; /* +8px gap below the heading */
      overflow: hidden;
    }

    #cardsStack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Card: 260px wide (300 - 2×20 padding) */
    .market-card {
      width: 260px;
      background: #fafafa;
      border: 1px solid #CDD4DB;
      border-radius: 11px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8.7px 0 0;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
    }

    .card-row {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 5.8px;
      padding: 0 8.7px;
      flex-shrink: 0;
    }

    .card-icon {
      width: 28.7px;
      height: 28.7px;
      border-radius: 5.3px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .card-question {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 10.16px;
      color: #272727;
      line-height: 14.52px;
      letter-spacing: -0.065px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      flex: 1;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      padding: 10px 8.7px 5.8px;
    }

    .card-outcomes {
      display: flex;
      flex-direction: column;
      gap: 5.8px;
      padding-bottom: 2.9px;
    }

    .card-data-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }

    .card-valuation {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 9.6px;
      color: #232a30;
      letter-spacing: -0.065px;
      white-space: nowrap;
      flex: 1;
    }

    .card-odds {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 2.9px;
    }

    .card-pct {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 10.9px;
      color: #232a30;
      padding-right: 2.9px;
      white-space: nowrap;
    }

    .card-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 29px;
      height: 19.6px;
      border-radius: 3.8px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 9.4px;
      cursor: pointer;
    }

    .card-pill.yes { background: rgba(73,193,117,0.15); color: #49c175; }
    .card-pill.no  { background: rgba(210,68,68,0.15);  color: #d24444; }

    .card-volume {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
    }

    .card-volume-text {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 8.976px;
      color: #7b8996;
      letter-spacing: -0.068px;
      white-space: nowrap;
    }

    .card-pm-icon {
      width: 7.392px;
      height: 8.844px;
      flex-shrink: 0;
    }

    /* Bottom gradient — fades the last card(s) into white */
    .pmt-overlay-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(to top, #fff 10%, rgba(255,255,255,0) 100%);
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div class="pmt-root" onclick="handleRootClick(event)">
  <div class="pmt-grid"></div>

  <!-- Top: logos + big headline -->
  <div class="pmt-top">
    <div class="logos-row">
      <img class="nasdaq" src="../assets/nasdaq-pm-300.svg" alt="Nasdaq × Polymarket" />
      <img class="xsep" src="../assets/x-sep-300.svg" alt="×" />
      <img class="pm-lockup" src="../assets/pm-lockup-300.svg" alt="Polymarket" />
    </div>
    <div class="headline">
      <span class="line1">Trade Private companies,</span>
      <span class="line2"><span class="muted">exclusively on </span><span class="blue">Polymarket</span></span>
    </div>
  </div>

  <!-- Cards stack — extends below visible area, faded by overlay -->
  <div class="pmt-cards-section">
    <div id="cardsStack"></div>
  </div>

  <div class="pmt-overlay-bottom"></div>
</div>

<script>
  var clickTag = 'https://polymarket.com/finance/privates';
  var API_URL = 'https://gamma-api.polymarket.com/events?active=true&limit=30&tag_slug=privates&order=volume&ascending=false';
  var REFRESH_MS = 60 * 60 * 1000;

  var VALUATION_RE = /will (.+?)['']s?\s+valuation hit/i;

  var COMPANY_ICONS = {
    'anthropic':  '../assets/icon-anthropic-300.png',
    'openai':     '../assets/icon-openai-300.png',
    'discord':    '../assets/icon-discord-300.png',
    'perplexity': '../assets/icon-perplexity-300.png',
    'spacex':     '../assets/icon-spacex.png',
    'stripe':     '../assets/icon-stripe.png',
  };

  function resolveIcon(company, fallback) {
    return COMPANY_ICONS[(company || '').toLowerCase()] || fallback || '';
  }

  function extractDollarAmount(label) {
    if (!label) return 0;
    var m = label.match(/\$([\d.]+)\s*([BT])?/i);
    if (!m) return 0;
    var n = parseFloat(m[1]);
    var unit = (m[2] || '').toUpperCase();
    return unit === 'T' ? n * 1000 : n;
  }

  function parseGammaEvents(events) {
    var byCompany = {};
    for (var i = 0; i < events.length; i++) {
      var evt = events[i];
      var match = VALUATION_RE.exec(evt.title || '');
      if (!match) continue;
      var company = match[1].trim();
      var vol = parseFloat(evt.volume || 0);
      if (!byCompany[company] || vol > parseFloat(byCompany[company].volume || 0)) {
        byCompany[company] = evt;
      }
    }
    var cards = [];
    for (var company in byCompany) {
      var card = eventToCard(company, byCompany[company]);
      if (card) cards.push(card);
    }
    cards.sort(function(a, b) { return b.volume - a.volume; });
    return cards.slice(0, 8);
  }

  function eventToCard(company, evt) {
    var markets = (evt.markets || []).filter(function(m) {
      var outcomes = [];
      try { outcomes = JSON.parse(m.outcomes || '[]'); } catch(_) {}
      return outcomes.length === 2 && outcomes[0].toLowerCase() === 'yes' && outcomes[1].toLowerCase() === 'no';
    });
    if (!markets.length) return null;
    markets.sort(function(a, b) { return parseFloat(b.volume || 0) - parseFloat(a.volume || 0); });
    var top2 = markets.slice(0, 2);
    top2.sort(function(a, b) { return extractDollarAmount(b.groupItemTitle) - extractDollarAmount(a.groupItemTitle); });
    var outcomes = top2.map(function(m) {
      var yesPct = 50;
      try {
        var prices = JSON.parse(m.outcomePrices || '[]');
        if (prices.length >= 1) yesPct = Math.round(parseFloat(prices[0]) * 100);
      } catch(_) {}
      return { valuation: (m.groupItemTitle || '').trim(), yesPct: yesPct, noPct: 100 - yesPct, slug: m.slug || '' };
    });
    return { company: company, question: evt.title || '', icon: resolveIcon(company, evt.icon), slug: evt.slug || '', volume: parseFloat(evt.volume || 0), outcomes: outcomes };
  }

  var FALLBACK = [
    { company: 'Anthropic', question: "Will Anthropic's valuation hit __ by Dec 31?", icon: '../assets/icon-anthropic-300.png', slug: '', volume: 0,
      outcomes: [{ valuation: '↑$1.75T', yesPct: 40, noPct: 60, slug: '' }, { valuation: '↑$3.0T', yesPct: 14, noPct: 86, slug: '' }] },
    { company: 'OpenAI', question: "Will OpenAI's valuation hit __ by Dec 31?", icon: '../assets/icon-openai-300.png', slug: '', volume: 0,
      outcomes: [{ valuation: '↓$800B', yesPct: 72, noPct: 28, slug: '' }, { valuation: '↓$750B', yesPct: 50, noPct: 50, slug: '' }] },
    { company: 'SpaceX', question: "Will SpaceX's valuation hit __ by Jun 30?", icon: '../assets/icon-spacex.png', slug: '', volume: 0,
      outcomes: [{ valuation: '↑$2.5T', yesPct: 46, noPct: 54, slug: '' }, { valuation: '↑$4.0T', yesPct: 3, noPct: 97, slug: '' }] },
    { company: 'Stripe', question: "Will Stripe's valuation hit __ by Jun 30?", icon: '../assets/icon-stripe.png', slug: '', volume: 0,
      outcomes: [{ valuation: '↑$190B', yesPct: 21, noPct: 79, slug: '' }, { valuation: '↑$200B', yesPct: 15, noPct: 85, slug: '' }] }
  ];

  function esc(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function handleRootClick(e) {
    if (e.target.closest('a')) return;
    if (typeof Enabler !== 'undefined' && Enabler.isInitialized && Enabler.isInitialized()) {
      Enabler.exit('clickTag', clickTag);
    } else {
      window.open(clickTag, '_blank');
    }
  }

  function handleCardClick(e, slug) {
    e.preventDefault();
    e.stopPropagation();
    var url = slug ? 'https://polymarket.com/event/' + slug : 'https://polymarket.com/finance/privates';
    if (typeof Enabler !== 'undefined' && Enabler.isInitialized && Enabler.isInitialized()) {
      Enabler.exit('clickTag', url);
    } else {
      window.open(url, '_blank');
    }
  }

  function formatVolume(vol) {
    if (!vol) return '';
    if (vol >= 1e9) return '$' + (vol / 1e9).toFixed(1) + 'B Vol.';
    if (vol >= 1e6) return '$' + (vol / 1e6).toFixed(1) + 'M Vol.';
    if (vol >= 1e3) return '$' + Math.round(vol / 1e3) + 'K Vol.';
    return '$' + Math.round(vol) + ' Vol.';
  }

  var PM_ICON_SVG = '<svg class="card-pm-icon" viewBox="0 0 13.507 16.268" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11.998 0.207C12.690 0.013 13.036-0.084 13.272 0.094C13.507 0.272 13.507 0.632 13.507 1.351V14.918C13.507 15.637 13.507 15.997 13.272 16.175C13.036 16.353 12.690 16.256 11.998 16.061L0.867 12.938C0.450 12.821 0.242 12.763 0.121 12.603C0 12.444 0 12.227 0 11.794V4.475C0 4.041 0 3.824 0.121 3.665C0.242 3.506 0.450 3.447 0.867 3.330L11.998 0.207Z M2.775 11.920L11.992 14.507V9.334L2.775 11.920Z M1.515 10.720L10.730 8.135L1.515 5.549V10.720Z M2.775 4.349L11.992 6.934V1.762L2.775 4.349Z" fill="#7b8996"/></svg>';

  function buildCard(card) {
    var cardSlug = card.slug || '';
    var cardUrl = cardSlug ? 'https://polymarket.com/event/' + esc(cardSlug) : 'https://polymarket.com/finance/privates';
    var el = document.createElement('a');
    el.className = 'market-card';
    el.href = cardUrl;
    el.target = '_blank';
    el.rel = 'noopener';
    el.addEventListener('click', function(e) { handleCardClick(e, cardSlug); });

    var outcomesHtml = '';
    var outcomes = card.outcomes || [];
    for (var i = 0; i < outcomes.length; i++) {
      var o = outcomes[i];
      var oSlug = o.slug || cardSlug;
      var yesPct = o.yesPct != null ? o.yesPct : 50;
      outcomesHtml +=
        '<div class="card-data-row">' +
          '<span class="card-valuation">' + esc(o.valuation || '') + '</span>' +
          '<div class="card-odds">' +
            '<span class="card-pct">' + yesPct + '%</span>' +
            '<span class="card-pill yes" data-slug="' + esc(oSlug) + '">Yes</span>' +
            '<span class="card-pill no" data-slug="' + esc(oSlug) + '">No</span>' +
          '</div>' +
        '</div>';
    }

    var volStr = formatVolume(card.volume || 0);
    var volumeHtml = volStr ? '<div class="card-volume"><span class="card-volume-text">' + esc(volStr) + '</span>' + PM_ICON_SVG + '</div>' : '';

    el.innerHTML =
      '<div class="card-row">' +
        '<img class="card-icon" src="' + esc(card.icon || '') + '" alt="" onerror="this.style.background=\'#eee\';this.src=\'\';" />' +
        '<div class="card-question">' + esc(card.question || '').replace(/ by /gi, '<br>by ') + '</div>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="card-outcomes">' + outcomesHtml + '</div>' +
        volumeHtml +
      '</div>';

    var pills = el.querySelectorAll('.card-pill');
    for (var p = 0; p < pills.length; p++) {
      (function(pill) {
        pill.addEventListener('click', function(e) {
          e.stopPropagation();
          handleCardClick(e, pill.getAttribute('data-slug'));
        });
      })(pills[p]);
    }
    return el;
  }

  function renderCards(cards) {
    var stack = document.getElementById('cardsStack');
    stack.innerHTML = '';
    // Render all cards; the bottom ones overflow and are faded by the gradient overlay
    for (var i = 0; i < cards.length; i++) {
      stack.appendChild(buildCard(cards[i]));
    }
  }

  async function fetchAndRender() {
    var cards = null;
    try {
      var res = await fetch(API_URL);
      if (res.ok) {
        var data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          cards = parseGammaEvents(data);
        }
      }
    } catch(e) {
      console.warn('[300x600] fetch failed', e);
    }
    renderCards(cards && cards.length ? cards : FALLBACK);
  }

  fetchAndRender();
  setInterval(fetchAndRender, REFRESH_MS);
</script>
</body>
</html>
