<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="ad.size" content="width=970,height=250" />
  <title>Polymarket 970x250</title>
  <script src="https://s0.2mdn.net/ads/studio/Enabler.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 970px;
      height: 250px;
      overflow: hidden;
      background: #fff;
    }

    .ad-root {
      position: relative;
      width: 970px;
      height: 250px;
      overflow: hidden;
      background: #fff;
    }

    /* Grid background */
    .ad-grid {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 648px;
      height: 648px;
      background-image: url('../assets/grid-970.png');
      background-position: center;
      background-size: contain;
      opacity: 0.4;
      pointer-events: none;
    }

    /* Logo pill — top-left */
    .logo-pill {
      position: absolute;
      left: 12px;
      top: 16px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(200,200,200,0.5);
      border-radius: 100px;
      padding: 8px 12px;
    }

    .logo-pill img.nasdaq {
      height: 40px;
      width: 101px;
      object-fit: contain;
    }

    .logo-pill img.xsep {
      width: 20.5px;
      height: 20.5px;
      object-fit: contain;
    }

    .logo-pill img.pm-lockup {
      height: 22.6px;
      width: 125px;
      object-fit: contain;
    }

    /* Headline — left side, vertically centered */
    .ad-headline {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      margin-top: 12px; /* shift down slightly to account for pill above */
    }

    .ad-headline .line1 {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 40px;
      letter-spacing: -2px;
      color: rgba(0,0,0,0.75);
      display: block;
      white-space: nowrap;
      line-height: 1.1;
    }

    .ad-headline .line2 {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 40px;
      letter-spacing: -2px;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .ad-headline .line2 .muted {
      color: rgba(0,0,0,0.6);
    }

    .ad-headline .line2 img {
      height: 37px;
      object-fit: contain;
    }

    /* Market cards container */
    .cards-container {
      position: absolute;
      left: 478px;
      top: 8px;
      display: grid;
      grid-template-columns: 241px 241px;
      grid-template-rows: 107px 107px;
      gap: 3px;
      width: 485px;
      height: 217px;
    }

    .market-card {
      width: 241px;
      height: 107px;
      background: #fafafa;
      border: 0.69px solid #cdd4db;
      border-radius: 10.5px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 8px 10px;
      cursor: pointer;
      text-decoration: none;
    }

    .card-top {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 7px;
      flex: 1;
    }

    .card-icon {
      width: 27px;
      height: 27px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .card-question {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 9.7px;
      color: #272727;
      line-height: 13.8px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .card-bottom {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      flex-shrink: 0;
    }

    .card-valuation {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 9.1px;
      color: #232a30;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90px;
    }

    .card-odds {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
    }

    .card-pct {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 10.4px;
      color: #272727;
    }

    .card-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 27.6px;
      height: 18.6px;
      border-radius: 3.6px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 9px;
    }

    .card-pill.yes {
      background: rgba(73,193,117,0.15);
      color: #49c175;
    }

    .card-pill.no {
      background: rgba(210,68,68,0.15);
      color: #d24444;
    }

    /* Gradient overlays */
    .topbar {
      position: absolute;
      right: 0;
      top: 0;
      width: 535px;
      height: 19px;
      background-image: url('../assets/topbar-970.png');
      background-size: 100% 100%;
      pointer-events: none;
    }

    .bottombar {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 535px;
      height: 28px;
      background-image: url('../assets/bottombar-970.png');
      background-size: 100% 100%;
      pointer-events: none;
      transform: scaleY(-1);
    }
  </style>
</head>
<body>

<div class="ad-root">
  <div class="ad-grid"></div>

  <!-- Logo pill -->
  <div class="logo-pill">
    <img class="nasdaq" src="../assets/nasdaq-pm-970.svg" alt="Nasdaq × Polymarket" />
    <img class="xsep" src="../assets/x-sep-970.svg" alt="×" />
    <img class="pm-lockup" src="../assets/pm-lockup-970.svg" alt="Polymarket" />
  </div>

  <!-- Headline -->
  <div class="ad-headline">
    <span class="line1">Trade private companies,</span>
    <div class="line2">
      <span class="muted">exclusively on</span>
      <img src="../assets/pm-inline-970.svg" alt="Polymarket" />
    </div>
  </div>

  <!-- Market cards -->
  <div class="cards-container" id="cardsContainer">
    <!-- Populated by JS -->
  </div>

  <!-- Overlay bars -->
  <div class="topbar"></div>
  <div class="bottombar"></div>
</div>

<script>
  var clickTag = 'https://polymarket.com/finance/privates';
  var API_URL = 'https://polymarket-ticker.vercel.app/api/markets';
  var REFRESH_MS = 60 * 60 * 1000;

  var FALLBACK = [
    { company: 'Anthropic', question: "Will Anthropic's valuation hit __ by Dec 31?", icon: '../assets/icon-anthropic.png', slug: '', volume: 0,
      outcomes: [{ valuation: '↑$1.75T', yesPct: 40, noPct: 60, slug: '' }, { valuation: '↑$3.0T', yesPct: 14, noPct: 86, slug: '' }] },
    { company: 'OpenAI', question: "Will OpenAI's valuation hit __ by Dec 31?", icon: '../assets/icon-openai.png', slug: '', volume: 0,
      outcomes: [{ valuation: '↓$800B', yesPct: 72, noPct: 28, slug: '' }, { valuation: '↓$750B', yesPct: 50, noPct: 50, slug: '' }] },
    { company: 'SpaceX', question: "Will SpaceX's valuation hit __ by Jun 30?", icon: '../assets/icon-spacex.png', slug: '', volume: 0,
      outcomes: [{ valuation: '↑$2.5T', yesPct: 46, noPct: 54, slug: '' }, { valuation: '↑$4.0T', yesPct: 3, noPct: 97, slug: '' }] },
    { company: 'Stripe', question: "Will Stripe's valuation hit __ by Jun 30?", icon: '../assets/icon-stripe.png', slug: '', volume: 0,
      outcomes: [{ valuation: '↑$190B', yesPct: 21, noPct: 79, slug: '' }, { valuation: '↑$200B', yesPct: 15, noPct: 85, slug: '' }] }
  ];

  function esc(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function handleCardClick(e, slug) {
    e.preventDefault();
    e.stopPropagation();
    var url = slug
      ? 'https://polymarket.com/event/' + slug
      : 'https://polymarket.com/finance/privates';
    if (typeof Enabler !== 'undefined' && Enabler.isInitialized && Enabler.isInitialized()) {
      Enabler.exit('clickTag', url);
    } else {
      window.open(url, '_blank');
    }
  }

  function buildCard(card) {
    var cardSlug = card.slug || '';
    var cardUrl = cardSlug
      ? 'https://polymarket.com/event/' + esc(cardSlug)
      : 'https://polymarket.com/finance/privates';

    var el = document.createElement('a');
    el.className = 'market-card';
    el.href = cardUrl;
    el.target = '_blank';
    el.rel = 'noopener';
    el.addEventListener('click', function(e) { handleCardClick(e, cardSlug); });

    var outcomesHtml = '';
    var outcomes = card.outcomes || [];
    for (var i = 0; i < outcomes.length; i++) {
      var o = outcomes[i];
      var oSlug = o.slug || '';
      var yesPct = o.yesPct != null ? o.yesPct : 50;
      outcomesHtml +=
        '<div class="card-data-row">' +
          '<span class="card-valuation">' + esc(o.valuation || '') + '</span>' +
          '<div class="card-odds">' +
            '<span class="card-pct">' + yesPct + '%</span>' +
            '<span class="card-pill yes" data-slug="' + esc(oSlug) + '">Yes</span>' +
            '<span class="card-pill no" data-slug="' + esc(oSlug) + '">No</span>' +
          '</div>' +
        '</div>';
    }

    el.innerHTML =
      '<div class="card-top">' +
        '<img class="card-icon" src="' + esc(card.icon || '') + '" alt="" onerror="this.style.background=\'#eee\';this.src=\'\';" />' +
        '<div class="card-question">' + esc(card.question || '') + '</div>' +
      '</div>' +
      outcomesHtml;

    // Attach pill click handlers after innerHTML is set
    var pills = el.querySelectorAll('.card-pill');
    for (var p = 0; p < pills.length; p++) {
      (function(pill) {
        pill.addEventListener('click', function(e) {
          e.stopPropagation();
          handleCardClick(e, pill.getAttribute('data-slug'));
        });
      })(pills[p]);
    }

    return el;
  }

  function renderCards(cards) {
    var container = document.getElementById('cardsContainer');
    var top4 = cards.slice(0, 4);
    container.innerHTML = '';

    for (var i = 0; i < top4.length; i++) {
      container.appendChild(buildCard(top4[i]));
    }
  }

  async function fetchAndRender() {
    var cards = null;
    try {
      var res = await fetch(API_URL);
      if (res.ok) {
        var data = await res.json();
        if (Array.isArray(data) && data.length > 0) cards = data;
      }
    } catch(e) {
      console.warn('[970] fetch failed', e);
    }
    renderCards(cards || FALLBACK);
  }

  fetchAndRender();
  setInterval(fetchAndRender, REFRESH_MS);
</script>
</body>
</html>
