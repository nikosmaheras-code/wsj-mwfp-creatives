<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polymarket Ad Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #111; color: #fff; font-family: 'Inter', sans-serif; }

    .header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: #0a0a0a;
    }
    .header-logo { display: flex; align-items: center; gap: 8px; }
    .header-title {
      font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.5);
      padding-left: 12px; border-left: 1px solid rgba(255,255,255,0.15);
    }

    /* Version switcher (segmented control on the right) */
    .version-switch {
      margin-left: auto;
      display: flex; gap: 0;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 3px;
    }
    .version-btn {
      padding: 6px 14px;
      border-radius: 5px;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.6);
      font: 500 13px/1 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .version-btn:hover { color: #fff; }
    .version-btn.active {
      background: #2e5cff;
      color: #fff;
    }

    /* Format tabs */
    .tab-bar {
      display: flex; align-items: center; gap: 4px;
      padding: 12px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: #0d0d0d;
      overflow-x: auto; flex-wrap: nowrap;
    }
    .tab-btn {
      padding: 6px 14px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: rgba(255,255,255,0.5);
      font: 500 13px/1 'Inter', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { border-color: rgba(255,255,255,0.25); color: rgba(255,255,255,0.85); }
    .tab-btn.active { background: #2e5cff; border-color: #2e5cff; color: #fff; }
    .tab-btn.disabled {
      opacity: 0.3; cursor: not-allowed; pointer-events: none;
    }

    .content {
      padding: 32px 24px;
      min-height: calc(100vh - 130px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .ad-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .ad-label {
      font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.35);
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .pmt-frame {
      background: #fff;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .pmt-frame iframe { display: block; border: none; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="24" height="24" rx="4" fill="#2e5cff"/>
      <path d="M7 5.5h5.2c2.5 0 4.3 1.6 4.3 4s-1.8 4-4.3 4H9.5v5H7V5.5zm2.5 6h2.6c1.1 0 1.9-.7 1.9-2s-.8-2-1.9-2H9.5v4z" fill="white"/>
    </svg>
    <span style="font-weight:600;font-size:15px;">Polymarket</span>
  </div>
  <span class="header-title">Ad Preview</span>
  <div class="version-switch" id="versionSwitch">
    <button class="version-btn" data-version="v1">V1 — Private Markets</button>
    <button class="version-btn" data-version="v2">V2 — AI Race</button>
  </div>
</div>

<div class="tab-bar" id="tabBar"></div>

<div class="content">
  <div class="ad-panel">
    <div class="ad-label" id="pmtLabel"></div>
    <div class="pmt-frame" id="pmtFrame">
      <iframe id="pmtIframe" scrolling="no"></iframe>
    </div>
  </div>
</div>

<script>
  // Format catalog. v2 doesn't include 728x90.
  var FORMATS = [
    { key: '728x90',   w: 728,  h: 90,  label: '728 × 90 — Leaderboard',     v1: true, v2: false },
    { key: '970x250',  w: 970,  h: 250, label: '970 × 250 — Billboard',      v1: true, v2: true  },
    { key: '300x600',  w: 300,  h: 600, label: '300 × 600 — Half Page',      v1: true, v2: true  },
    { key: '300x250',  w: 300,  h: 250, label: '300 × 250 — Medium Rect',    v1: true, v2: true  },
    { key: '600x500',  w: 600,  h: 500, label: '600 × 500',                  v1: true, v2: true  },
    { key: '1280x500', w: 1280, h: 500, label: '1280 × 500',                 v1: true, v2: true  },
    { key: '1960x500', w: 1960, h: 500, label: '1960 × 500',                 v1: true, v2: true  },
    { key: '3800x800', w: 3800, h: 800, label: '3800 × 800',                 v1: true, v2: true  },
  ];

  var DIR_BY_VERSION = { v1: 'embed', v2: 'embed-v2' };

  var state = {
    version: 'v1',
    formatKey: '970x250',
  };

  // ── Build tab bar
  var tabBar = document.getElementById('tabBar');
  FORMATS.forEach(function(f) {
    var btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.dataset.format = f.key;
    btn.textContent = f.key.replace('x', ' × ');
    btn.addEventListener('click', function() {
      if (btn.classList.contains('disabled')) return;
      state.formatKey = f.key;
      sync();
    });
    tabBar.appendChild(btn);
  });

  // ── Version switcher
  document.querySelectorAll('.version-btn').forEach(function(b) {
    b.addEventListener('click', function() {
      state.version = b.dataset.version;
      // If the current format isn't available in this version, jump to first available
      var current = FORMATS.find(function(f) { return f.key === state.formatKey; });
      if (!current || !current[state.version]) {
        var firstAvail = FORMATS.find(function(f) { return f[state.version]; });
        if (firstAvail) state.formatKey = firstAvail.key;
      }
      sync();
    });
  });

  function sync() {
    // Update version buttons
    document.querySelectorAll('.version-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.version === state.version);
    });
    // Update tab buttons (active + disabled state per version)
    document.querySelectorAll('.tab-btn').forEach(function(b) {
      var f = FORMATS.find(function(x) { return x.key === b.dataset.format; });
      var avail = f && f[state.version];
      b.classList.toggle('active', b.dataset.format === state.formatKey);
      b.classList.toggle('disabled', !avail);
    });
    // Update iframe + label + sizing
    var fmt = FORMATS.find(function(f) { return f.key === state.formatKey; });
    var dir = DIR_BY_VERSION[state.version];
    var iframe = document.getElementById('pmtIframe');
    var frame = document.getElementById('pmtFrame');
    document.getElementById('pmtLabel').textContent = fmt.label + ' — ' + state.version.toUpperCase();
    // Reset previous transforms
    iframe.style.transform = '';
    iframe.style.transformOrigin = '';
    iframe.style.width = '';
    iframe.style.height = '';
    // Cache-bust to force reload when switching versions/formats
    iframe.src = dir + '/' + fmt.key + '.html?t=' + Date.now();
    iframe.width = fmt.w;
    iframe.height = fmt.h;
    // Scale to fit viewport if needed
    requestAnimationFrame(scaleFrame);
    // Update URL hash so refresh keeps state
    window.location.hash = state.version + ':' + state.formatKey;
  }

  function scaleFrame() {
    var fmt = FORMATS.find(function(f) { return f.key === state.formatKey; });
    var content = document.querySelector('.content');
    var available = content.clientWidth - 48;
    var scale = Math.min(1, available / fmt.w);
    var frame = document.getElementById('pmtFrame');
    var iframe = document.getElementById('pmtIframe');
    if (scale < 1) {
      frame.style.width = Math.floor(fmt.w * scale) + 'px';
      frame.style.height = Math.floor(fmt.h * scale) + 'px';
      iframe.style.transform = 'scale(' + scale + ')';
      iframe.style.transformOrigin = 'top left';
      iframe.style.width = fmt.w + 'px';
      iframe.style.height = fmt.h + 'px';
    } else {
      frame.style.width = ''; frame.style.height = '';
      iframe.style.transform = '';
      iframe.style.transformOrigin = '';
      iframe.style.width = ''; iframe.style.height = '';
    }
  }
  window.addEventListener('resize', scaleFrame);

  // Init from hash (e.g. #v2:970x250) or default
  var hash = window.location.hash.replace('#', '');
  if (hash && hash.indexOf(':') !== -1) {
    var parts = hash.split(':');
    if (DIR_BY_VERSION[parts[0]] && FORMATS.find(function(f) { return f.key === parts[1]; })) {
      state.version = parts[0];
      state.formatKey = parts[1];
    }
  }
  // Make sure initial formatKey is available in the chosen version
  var currentFmt = FORMATS.find(function(f) { return f.key === state.formatKey; });
  if (!currentFmt || !currentFmt[state.version]) {
    var firstAvail = FORMATS.find(function(f) { return f[state.version]; });
    if (firstAvail) state.formatKey = firstAvail.key;
  }
  sync();

  // Auto-refresh iframe every hour to pick up live odds changes
  setInterval(function() {
    var iframe = document.getElementById('pmtIframe');
    if (iframe && iframe.src) iframe.src = iframe.src.replace(/[?&]t=\d+/, '') + '?t=' + Date.now();
  }, 60 * 60 * 1000);
</script>
</body>
</html>
